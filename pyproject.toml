[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttwtools"
version = "0.2.0"
description = "Tagging and key feature analysis tools built around BiberPlus workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "tqdm",
  "matplotlib",
  "seaborn",
  "biberplus",
  "spacy>=3.0",
  # sqlite3 é built-in do Python — sem dependência extra
]

[project.optional-dependencies]
mfte = ["stanza>=1.9", "MFTE>=1.0", "torch"]
dev = ["pytest"]
parquet = ["pyarrow"]

[project.scripts]
ttwtools = "ttwtools.cli:main"

[tool.setuptools]
packages = ["ttwtools", "ttwtools.taggers", "ttwtools.formats"]

[tool.setuptools.package-data]
ttwtools = ["*.json", "data/*.json", "data/*/*.json", "data/*/*.txt", "data/help/*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
